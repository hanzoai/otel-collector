name: Build & Push to GHCR

on:
  push:
    branches: [main, rebrand/hanzo-o11y]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  collector:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/otel-collector
      dockerfile: cmd/o11yotelcollector/Dockerfile
      pre-build-command: |
        ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        mkdir -p .build/linux-${ARCH}
        CGO_ENABLED=0 GOOS=linux GOARCH=${ARCH} go build \
          -o .build/linux-${ARCH}/hanzo-otel-collector ./cmd/o11yotelcollector
    secrets: inherit

  schema-migrator:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/o11y-schema-migrator
      dockerfile: cmd/o11yschemamigrator/Dockerfile
      pre-build-command: |
        ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
        mkdir -p .build/linux-${ARCH}
        CGO_ENABLED=0 GOOS=linux GOARCH=${ARCH} go build \
          -o .build/linux-${ARCH}/o11y-schema-migrator ./cmd/o11yschemamigrator
    secrets: inherit
