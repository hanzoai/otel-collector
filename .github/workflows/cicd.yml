# Canonical Hanzo CI/CD. All build/test/deploy logic lives ONCE in the reusable
# hanzoai/ci workflow; this file only wires triggers + secrets. The reusable reads
# the root hanzo.yml and runs on our self-hosted arc pool (hanzo-build-linux-amd64)
# by default — no GitHub-hosted minutes. This is the going-forward pattern for all
# native-PaaS repos; do not add per-repo build logic here.
name: cicd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cicd:
    # CANONICAL ref is @main. Temporarily pinned to the fix branch because
    # hanzoai/ci@main currently fails on the stock arc runner (missing PyYAML/jq);
    # the fix is hanzoai/ci#4 (fix/provision-parse-toolchain). Flip back to @main
    # the moment #4 merges — that is the one-and-only canonical import.
    uses: hanzoai/ci/.github/workflows/build.yml@fix/provision-parse-toolchain
    secrets: inherit
