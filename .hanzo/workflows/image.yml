name: image
# THE builder for ghcr.io/hanzoai/otel-collector, on Hanzo's own forge.
#
#   git.hanzo.ai push (incl. mirror-sync from GitHub) → act_runner
#   → buildx → ghcr.io/hanzoai/otel-collector:sha-<7>
#
# WHY THIS FILE EXISTS. c98ce63 ("ci: remove GitHub CI — native git.hanzo.ai +
# cd.hanzo.ai only") deleted .github/workflows/cicd.yml and never added the
# native replacement, so `git ls-files | grep workflows` returned ZERO and every
# commit since built nothing anywhere. Measured 2026-07-29: the otel-agent
# DaemonSet still runs :v0.1.0 on all 18 nodes, and the fix that lets the agent
# talk to the fleet (f3e3372, zap-proto/http v0.3.1) sat unbuilt on main while
# o11y_logs.logs_v2 went 37h without a write. This is the repair.
#
# Dockerfile.selfbuild, not Dockerfile. The plain one COPYs .build/<os>-<arch>/
# hanzo-otel-collector, a binary a pre-build step produced; nothing here
# produces it, so that path builds an image with no binary in it. selfbuild
# compiles in-image and runs the zapreceiver+zapexporter tests as a build gate,
# so a green run means the ZAP surface this distro adds over upstream actually
# passed.
#
# No GIT_AUTH_TOKEN. The only non-stdlib roots are github.com/zap-proto/{http,go},
# which resolve on proxy.golang.org (verified 200 for v0.3.1) — this module pulls
# nothing from the private hanzoai/* namespace, so there is no secret to leak or
# to forget to provision.
#
# TWO TAG SHAPES, one rule: a published tag never moves.
#
#   main push → sha-<7>   traceability. Every commit gets an image.
#   v* tag    → vX.Y.Z    the production pin. What a DaemonSet is allowed to name.
#
# The original note here said SHA-only, because a re-pushed semver leaves two
# digests behind one name and imagePullPolicy: IfNotPresent makes a node keep
# whichever it cached first — that is how platform's v4.4.5 came to mean two
# different builds. That danger is real, but the cure is not banning semver: a
# SHA in a production manifest says nothing about what changed or whether it is
# newer than what it replaces, and reviewing one is guesswork.
#
# So semver is built here and made IMMUTABLE by refusing to overwrite: the guard
# below fails the run if the tag already resolves at the registry. Re-pushing a
# moved tag cannot silently republish; cut the next patch instead.
#
# No kubectl rollout here. The DaemonSet's image is a reviewed pin in
# hanzoai/universe under Hanzo CD selfHeal, so a patch from a runner is reverted
# on the next poll — and this runner holds no kubeconfig. Rollout is that pin.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-otel-collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      # A tag ref publishes its own name; a branch push publishes the SHA.
      - id: meta
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
            *)           tag="sha-$(echo "$GITHUB_SHA" | cut -c1-7)" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # arm64 is emulated on this amd64 pool. Dockerfile.selfbuild's builder stage
      # is not pinned to BUILDPLATFORM, so its `go test`, its `go build` and the
      # runtime apt-get all execute as arm64; without binfmt they exec-format-error.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Immutability gate — AFTER login, or the inspect fails for want of
      # credentials and an already-published tag reads as unpublished, which is
      # precisely the overwrite this is here to stop.
      #
      # SHA tags are exempt: the same commit rebuilt is the same source, so a
      # re-run after an infrastructure failure must not be blocked.
      - name: Refuse to overwrite a published version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/otel-collector:${{ steps.meta.outputs.tag }}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "::error::$img is already published. A released version never moves — cut the next patch."
            exit 1
          fi
          echo "$img is unpublished — proceeding"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cmd/o11yotelcollector/Dockerfile.selfbuild
          # Both, because the fleet is both: the otel-agent DaemonSet also lands on
          # spark (arm64), where an amd64-only image is an ImagePullBackOff.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/hanzoai/otel-collector:${{ steps.meta.outputs.tag }}

      # build-push-action can exit 0 before the manifest is resolvable at the
      # registry. Prove the image actually pulls, so a green run always means a
      # usable image rather than a future ImagePullBackOff.
      - name: Verify the pushed image resolves
        run: |
          set -euo pipefail
          img="ghcr.io/hanzoai/otel-collector:${{ steps.meta.outputs.tag }}"
          for i in 1 2 3 4 5 6; do
            if docker manifest inspect "$img" >/dev/null 2>&1; then
              echo "$img is pullable"; exit 0
            fi
            echo "manifest not visible yet (attempt $i/6) — retrying"; sleep 5
          done
          echo "::error::$img not pullable after push"; exit 1
