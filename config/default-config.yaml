receivers:
  # The ZAP wire — the transport this collector accepts.
  zap:
    endpoint: 0.0.0.0:4319
processors:
  batch:
    send_batch_size: 1000
    timeout: 10s
  o11yspanmetrics/prometheus:
    metrics_exporter: prometheus
    latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s ]
    dimensions_cache_size: 10000
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: default
  o11yspanmetrics/delta:
    metrics_exporter: o11ydatastoremetrics
    metrics_flush_interval: 60s
    latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s ]
    dimensions_cache_size: 100000
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: true
    skip_spans_older_than: 24h
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: default
      # This is added to ensure the uniqueness of the timeseries
      # Otherwise, identical timeseries produced by multiple replicas of
      # collectors result in incorrect APM metrics
      - name: o11y.collector.id
      - name: service.version
      - name: browser.platform
      - name: browser.mobile
      - name: k8s.cluster.name
      - name: k8s.node.name
      - name: k8s.namespace.name
      - name: host.name
      - name: host.type
      - name: container.name
      - name: special.random.attribute
      - name: generated.by
  # memory_limiter:
  #   # 80% of maximum memory up to 2G
  #   limit_mib: 1500
  #   # 25% of limit up to 2G
  #   spike_limit_mib: 512
  #   check_interval: 5s
  #
  #   # 50% of the maximum memory
  #   limit_percentage: 50
  #   # 20% of max memory usage spike expected
  #   spike_limit_percentage: 20
  # queued_retry:
  #   num_workers: 4
  #   queue_size: 100
  #   retry_on_failure: true
extensions:
  zpages: {}
exporters:
  datastoretraces:
    datasource: tcp://localhost:9000/o11y_traces
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 100
      num_consumers: 5
  o11ydatastoremetrics:
    sending_queue:
      enabled: false
    dsn: tcp://localhost:9000/o11y_metrics
  datastorelogsexporter:
    dsn: tcp://localhost:9000/o11y_logs
    timeout: 10s
    sending_queue:
      enabled: false
    use_new_schema: true
  prometheus:
    endpoint: "0.0.0.0:8889"
service:
  extensions: [zpages]
  pipelines:
    traces:
      receivers: [zap]
      processors: [o11yspanmetrics/delta, batch]
      exporters: [datastoretraces]
    metrics:
      receivers: [zap]
      processors: [batch]
      exporters: [o11ydatastoremetrics]
    logs:
      receivers: [zap]
      processors: [batch]
      exporters: [datastorelogsexporter]
    metrics/spanmetrics:
      receivers: [zap]
      exporters: [prometheus]