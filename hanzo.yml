# Hanzo CI/CD — canonical build/test/deploy config for the O11y OTel Collector.
#
# ONE file, read by BOTH GitHub Actions (via .github/workflows/cicd.yml, which
# imports the reusable hanzoai/ci workflow) AND platform.hanzo.ai. The build runs
# on our self-hosted arc pool (hanzo-build-linux-amd64) — ZERO GitHub-hosted
# minutes; GitHub only orchestrates, our infra does the work.
#
# This is the going-forward pattern for every native-PaaS repo: a root hanzo.yml
# + a ~7-line cicd.yml. See README.md § "CI/CD — canonical pattern".

images:
  # The ZAP-native O11y collector. filelog / OTLP / ZAP in, ClickHouse
  # (hanzoai/datastore) out. Dockerfile.selfbuild is a self-contained multi-stage
  # build that COMPILES the collector in-image — including receiver/zapreceiver +
  # exporter/zapexporter — so no CI pre-build step is needed (unlike ./Dockerfile,
  # which COPYs a pre-built binary). tag-suffix qualifies every tag, e.g.
  #   ghcr.io/hanzoai/otel-collector:zap-native-latest
  #   ghcr.io/hanzoai/otel-collector:sha-<short>-amd64-zap-native   (immutable)
  - name: collector
    repo: ghcr.io/hanzoai/otel-collector
    context: .
    dockerfile: cmd/o11yotelcollector/Dockerfile.selfbuild
    tag-suffix: zap-native

  # ClickHouse schema migrator — creates/updates the signoz_logs / signoz_traces /
  # signoz_metrics DDL in hanzoai/datastore. Self-building (mirrors the collector).
  - name: schema-migrator
    repo: ghcr.io/hanzoai/o11y-schema-migrator
    context: .
    dockerfile: cmd/o11yschemamigrator/Dockerfile.selfbuild

# Fast, targeted gate on the ZAP wire (the surface this repo adds over upstream).
# A full `go test ./...` on this distro is minutes-long; the ZAP receiver+exporter
# are what must never regress, so we gate exactly those.
test:
  - name: zap-transport
    run: go test ./receiver/zapreceiver/... ./exporter/zapexporter/...

# On push to main, roll the in-cluster collector Deployment to the freshly-built
# immutable tag. (The otel-collector-config ConfigMap + the otel-agent DaemonSet
# are applied from hanzoai/universe; this only rolls the Deployment image.)
deploy:
  namespace: hanzo
  on: [main]
  services:
    - name: otel-collector
      image: collector

# Deploy credentials (KUBECONFIG) are org-scoped in KMS; the build/push path uses
# the automatic GitHub workflow token, so KMS is only needed for the deploy step.
kms:
  org: hanzo
  environment: prod
  path: /deploy
